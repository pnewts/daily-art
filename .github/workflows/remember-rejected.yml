# When a "new videos" pull request is closed WITHOUT merging, remember its videos
# in rejected.json so the monthly search never proposes them again.
name: Remember rejected videos

on:
  pull_request:
    types: [closed]

permissions:
  contents: write   # to save rejected.json on main

jobs:
  remember:
    if: github.event.pull_request.merged == false && startsWith(github.head_ref, 'new-videos-')
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files (main)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Get the rejected batch's video list
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head"
          git show FETCH_HEAD:videos.json > "$RUNNER_TEMP/batch.json"

      - name: Remember the rejected videos
        run: python scripts/remember_rejected.py "$RUNNER_TEMP/batch.json"

      - name: Save rejected.json
        run: |
          if git diff --quiet rejected.json; then
            echo "Nothing new to remember."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Remember videos from closed pull request #${{ github.event.pull_request.number }}"
          git push origin main
